# postgresql.conf unico para todos os testes
listen_addresses = '*'
port = 5432
max_connections = 20

# memoria
shared_buffers = 256MB
work_mem = 32MB
maintenance_work_mem = 512MB
effective_cache_size = 2GB

# reducao de ruido na medicao
autovacuum = off                    # VACUUM ANALYZE e feito manualmente pelo script
jit = off                           # evita variacao de compilacao JIT entre rodadas
max_parallel_workers_per_gather = 0 # sem paralelismo, plano mais estavel
max_parallel_maintenance_workers = 0

# carga e checkpoints
max_wal_size = 4GB
checkpoint_timeout = 30min

# coleta de metricas
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
track_io_timing = on

# custo do planejador: valores padrao do PostgreSQL (random_page_cost = 4.0)
